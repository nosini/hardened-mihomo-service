# Apps may only send through mihomo's TUN device; only mihomo's own sockets (meta skuid
# mihomo) may use the physical interfaces. "Mihomo" must match tun.device in config.yaml.
table inet killswitch {
    # Destinations apps may reach directly, without the tunnel: the LAN, the router, hosts
    # excluded from the TUN with tun.route-exclude-address. Not a WAN leak, as long as only
    # local addresses go here. Fill them in from /etc/nftables-killswitch.d/ (see the end
    # of this file) so this file stays the same on every machine.
    set direct4 {
        type ipv4_addr
        flags interval
    }

    set direct6 {
        type ipv6_addr
        flags interval
    }

    chain output {
        type filter hook output priority -100; policy drop;
        ct state invalid drop
        oifname "lo" accept
        ip daddr @direct4 accept
        ip6 daddr @direct6 accept
        # Block QUIC for apps (forces TCP), but let mihomo's own outbounds use UDP/443
        udp dport 443 meta skuid != mihomo drop
        oifname "Mihomo" accept
        # mihomo's own outbounds, on whichever uplink the routing table picks
        meta skuid mihomo accept
        ip6 daddr ff00::/8 accept
        ip6 daddr fe80::/10 accept
        udp dport { 67, 68 } accept
        udp dport 547 accept
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert,
                      nd-router-solicit, nd-router-advert,
                      destination-unreachable, packet-too-big,
                      time-exceeded, parameter-problem,
                      echo-request, echo-reply } accept
    }

    chain input {
        type filter hook input priority -100; policy drop;
        ct state invalid drop
        iifname "lo" accept
        iifname "Mihomo" accept
        # Replies to whatever the output chain let out
        ct state established,related accept
        udp sport { 67, 68 } accept
        ip6 saddr fe80::/10 accept
        ip6 saddr ff00::/8 accept
        udp sport 547 accept
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert,
                      nd-router-solicit, nd-router-advert,
                      destination-unreachable, packet-too-big,
                      time-exceeded, parameter-problem,
                      echo-request, echo-reply } accept
        icmp type echo-request accept
        icmpv6 type echo-request accept
    }
}

# Machine-specific additions, e.g. /etc/nftables-killswitch.d/lan.conf containing
#     add element inet killswitch direct4 { 192.168.1.0/24 }
# A wildcard include that matches no files is not an error.
include "/etc/nftables-killswitch.d/*.conf"
